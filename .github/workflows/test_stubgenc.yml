name: Test stubgenc on pybind11_fixtures

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release*']
    tags: ['*']
  pull_request:
    paths:
    - 'misc/test-stubgenc.sh'
    - 'mypy/stubgenc.py'
    - 'mypy/stubdoc.py'
    - 'mypy/stubutil.py'
    - 'test-data/pybind11_fixtures/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  stubgenc:
    # Check stub file generation for a small pybind11 project
    # (full text match is required to pass)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Setup 🐍 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'

    - name: Test stubgenc
      run: misc/test-stubgenc.sh
